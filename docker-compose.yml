# ============================================================================
# 只编排 NestJS 服务；MySQL / Redis 使用现成的容器或外部客户端
#
# 位置：与 Dockerfile.server / .dockerignore 同级（仓库根）
# 用法：先在仓库根建 .env 写入下面的连接信息，然后
#   docker compose up -d --build
#
# .env 内容（仓库根，勿提交）：
#   MYSQL_HOST=...          # 容器可访问的 MySQL 地址
#   MYSQL_PASSWORD=...
#   REDIS_HOST=...          # 容器可访问的 Redis 地址
#   JWT_SECRET=...
#
# 首次初始化数据库与后续表结构变更参见 README「数据库教程」
# ============================================================================

services:
  server:
    build:
      # 上下文 = 仓库根，和根目录的 .dockerignore 同级（Docker 只读上下文根下的 .dockerignore）
      context: .
      dockerfile: Dockerfile.server
    image: nest-admin-server:latest
    container_name: nest-admin-server
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      TZ: Asia/Shanghai
      SERVER_PORT: 3000
      SERVER_GLOBAL_PREFIX: /api
      SERVER_IS_DEMO: 'false'
      # 连接外部 MySQL / Redis，地址由仓库根 .env 提供
      MYSQL_HOST: ${MYSQL_HOST:?请先在仓库根 .env 配置 MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请先在仓库根 .env 配置 MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nestdemo}
      # 表结构由 TypeORM 迁移负责，init.sql 只作种子，禁止 TypeORM 自动改表
      MYSQL_SYNCHRONIZE: 'false'
      REDIS_HOST: ${REDIS_HOST:?请先在仓库根 .env 配置 REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      JWT_SECRET: ${JWT_SECRET:?请先在仓库根 .env 配置 JWT_SECRET}
      JWT_EXPIRES_IN: 1800
      JWT_REFRESH_EXPIRES_IN: 604800
    volumes:
      # 上传文件 / 日志目录都相对 process.cwd()，即 /app
      - uploads:/app/uploads
      - logs:/app/logs

volumes:
  uploads:
  logs:
